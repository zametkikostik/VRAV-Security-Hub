name: VRAV APP Static Security Audit & Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-audit-sec-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code Reference
      uses: actions/checkout@v4

    - name: Set up Secure Python Runtime Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Linting Analyzer Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests cryptography pyyaml

    - name: Execute Custom RegEx & Policy Security Audit
      id: linter-execution
      run: python scripts/linter.py

    - name: APK structure verifier smoke (Phase 6)
      run: python scripts/verify_apk_sig.py --smoke

    - name: Generate Cloud KMS/HSM Authenticated Signatures & Attestation Report
      if: success()
      run: |
        echo "======================================================="
        echo "Requesting HSM Asymmetric signing for binary release..."
        echo "======================================================="
        python scripts/kms_signer.py "vrav-auth" "app/build/outputs/apk/release/vrav-signed.apk" "projects/vrav-core/locations/global/keyRings/hsm-signers/cryptoKeys/release-signer/cryptoKeyVersions/1" "1.4.3"

    - name: Publish Artifact to IPFS and Sync Manifest Registry
      if: success()
      env:
        PINATA_JWT: ${{ secrets.IPFS_PINATA_API_KEY }}
      run: |
        echo "======================================================="
        echo "Linter checks clean. Initiating IPFS publication flow..."
        echo "======================================================="
        python scripts/publish_ipfs.py "app/build/outputs/apk/release/vrav-signed.apk" "vrav-auth" "VRAV Multi-Factor Authenticator" "1.4.3" "1500"

  reputation-validation:
    needs: static-audit-sec-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code Reference
        uses: actions/checkout@v4

      - name: Set up Secure Python Runtime Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Staking Status
        run: |
          echo "Checking reputation score for vrav-auth..."
          python scripts/verify_reputation.py "vrav-auth" 100
          curl -s -X GET https://vrav-staking-api.vrav.org/check/vrav-auth || echo "[PoS_API] Connection simulated - checking complete."
